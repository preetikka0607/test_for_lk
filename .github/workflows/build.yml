name: Build and push Vue image to ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: vue-ec2-deployment
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 877969058937.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: learning-vue

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Check GitHub OIDC identity
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          request = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          })
          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          print("Audience:", claims["aud"])
          print("Subject:", claims["sub"])
          PY

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::877969058937:role/GitHubEcrRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Log Docker into ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .

      - name: Push Docker image to ECR
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
    
            - name: Prepare EC2 deployment command
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import shlex
          from pathlib import Path

          image = f"{os.environ['ECR_REGISTRY']}/{os.environ['ECR_REPOSITORY']}:{os.environ['IMAGE_TAG']}"
          arguments = [
              image,
              os.environ["AWS_REGION"],
              os.environ["ECR_REGISTRY"]
          ]
          script = Path(".github/scripts/deploy.sh").read_text()
          command = (
              "bash -s -- " + shlex.join(arguments) +
              " <<'DEPLOY_SCRIPT'\n" + script + "\nDEPLOY_SCRIPT"
          )
          Path("ssm-parameters.json").write_text(json.dumps({
              "commands": [command],
              "executionTimeout": ["600"]
          }))
          PY

      - name: Deploy image to EC2
        env:
          INSTANCE_ID: i-009b374078938a00f
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command: $COMMAND_ID"

          for attempt in {1..7}; do
            if aws ssm wait command-executed \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID"; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}'
              exit 0
            fi

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status --output text)

            case "$STATUS" in
              Pending|InProgress|Delayed) continue ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}'
          exit 1