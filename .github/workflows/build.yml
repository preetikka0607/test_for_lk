name: Build and deploy Vue app to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: vue-ec2-deployment
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 877969058937.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: learning-vue

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::877969058937:role/GitHubEcrRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Log Docker into ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .

      - name: Push Docker image to ECR
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Prepare EC2 deployment command
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import shlex
          from pathlib import Path

          image = (
              f"{os.environ['ECR_REGISTRY']}/"
              f"{os.environ['ECR_REPOSITORY']}:"
              f"{os.environ['IMAGE_TAG']}"
          )

          arguments = [
              image,
              os.environ["AWS_REGION"],
              os.environ["ECR_REGISTRY"]
          ]

          script = Path(".github/scripts/deploy.sh").read_text()

          command = (
              "bash -s -- " + shlex.join(arguments) +
              " <<'DEPLOY_SCRIPT'\n" + script + "\nDEPLOY_SCRIPT"
          )

          Path("ssm-parameters.json").write_text(json.dumps({
              "commands": [command],
              "executionTimeout": ["600"]
          }))
          PY

      - name: Deploy image to EC2
        env:
          INSTANCE_ID: i-009b374078938a00f
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command: $COMMAND_ID"

          for attempt in {1..7}; do
            if aws ssm wait command-executed \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID"; then

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}'

              exit 0
            fi

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text)

            case "$STATUS" in
              Pending|InProgress|Delayed) continue ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}'

          exit 1