name: Build and save Vue Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t learning-vue:${{ github.sha }} .

      - name: List Docker images
        run: docker image ls

      - name: Export Docker image to a file
        run: docker save -o learning-vue.tar learning-vue:${{ github.sha }}

      - name: Upload image as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: learning-vue-image
          path: learning-vue.tar
          retention-days: 1
          if-no-files-found: error